<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Entrenador</title>
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/formStyle.css">
</head>
<body>
    <header id="header">

    </header>
    <div class="caluga">
        <div id="titulo">
            <h2>¡Bienvenido nuevo entrenador!</h2>
            <h2>Por favor ingrese sus datos</h2>
            <br>
        </div>

        <div id="datos">

            <br>
            <form action="/enviar" method="post" id="formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Ash Ketchup">
                <span id="error-nombre"></span>

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: ash.ket@gmail.com">
                <span id="error-correo"></span>

                <label for="correo2">Confirme su correo</label>
                <input type="email" id="correo2" name="correo2" placeholder="Repita su correo">
                <span id="error-correo2"></span>

                <label for="contraseña">Contraseña</label>
                <input type="text" id="contraseña" name="contraseña" placeholder="Debe contener entre 4 y 10 caracteres">
                <span id="error-contraseña"></span>

                <label for="contraseña2">Confirme su contraseña</label>
                <input type="text" id="contraseña2" name="contraseña2" placeholder="Repita su contraseña">
                <span id="error-contraseña2"></span>

                <label for="telefono">Telefono (Opcional)</label>
                <input type="text" id ="telefono" name="telefono" placeholder="+569 XXX XX XXX">
                <span id="error-telefono"></span>

                <label for="region">Elige una opción:</label>
                    <select id="region" name="region">
                        <option value="" disabled selected>-- Seleccione su conjunto residencial --</option>
                        <option value="opcion1">Pueblo Paleta</option>
                        <option value="opcion2">Ciudad Verde</option>
                        <option value="opcion3">Ciudad Plateada</option>
                        <option value="opcion4">Ciudad Celeste</option>
                        <option value="opcion5">Ciudad Carmin</option>
                        <option value="opcion6">Pueblo Lavanda</option>
                        <option value="opcion7">Ciudad Azulona</option>
                        <option value="opcion8">Ciudad Azafran</option>
                        <option value="opcion9">Ciudad Fucsia</option>
                        <option value="opcion10">Isla Canela</option>
                    </select>
                <span id="error-region"></span>


                <button id="btnRegistrar" type="submit">Registrar</button>
            </form>

            <br>
        </div>

    </div>
    <br>
    <footer id="footer">

    </footer>

</body>
<script src="../scripts/injector.js"></script>
<script src="../scripts/validadores.js"></script>
<script src="../scripts/registro.js"></script>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/formStyle.css"
</head>
<body>
    <header id="header">

    </header>
    <div class="caluga">
        <div id="titulo">
            <h2>¡Bienvenido devuelta entrenador!</h2>
            <h2>Por favor ingrese sus datos</h2>
        </div>

        <div id="datos">

            <form action="/enviar" method="post" id="formulario">
                <label for="correo">Correo</label>
                <input type="text" id="correo" name="correo">

                <label for="contraseña">Contraseña</label>
                <input type="text" id="contraseña" name="contraseña">

                <button id="btnIniciar" type="submit">Iniciar Sesion</button>
            </form>
            <br>
            <span>¿No tienes una cuenta?<a href="registroEntrenador.html">¡Registrate!</a></span>
        </div>

    </div>
    <footer id="footer">

    </footer>
</body>
<script src="../scripts/injector.js"></script>
</html>
